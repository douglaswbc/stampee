<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4a624" />
    <title>Sem conexão — Stampfy</title>
    <style>
      :root { color-scheme: light; font-family: Inter, system-ui, sans-serif; background: #f8f8f8; color: #21192f; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { width: min(100%, 420px); border: 1px solid #e4e4e7; border-radius: 24px; background: white; padding: 28px; box-shadow: 0 20px 60px -42px #21192f; }
      img { width: 48px; height: 48px; }
      h1 { margin: 20px 0 8px; font-size: 1.5rem; }
      p { color: #62616b; line-height: 1.6; }
      button { margin-top: 12px; border: 0; border-radius: 12px; background: #21192f; color: white; padding: 12px 18px; font: inherit; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <img src="/pwa-icon.svg" alt="" />
      <h1 id="offline-title">Você está sem conexão</h1>
      <p id="offline-description">Conecte-se à internet para atualizar cartões, visitas, missões e recompensas. Nenhuma ação de fidelidade pode ser confirmada offline.</p>
      <button id="offline-retry" type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
    <script>
      const language = localStorage.getItem('stampfy_interface_language_v1') || navigator.language || 'pt-BR';
      const translations = language.startsWith('es')
        ? ['Sin conexión', 'Conéctate a internet para actualizar tarjetas, visitas, misiones y recompensas. Las acciones de fidelidad no se pueden confirmar sin conexión.', 'Intentar de nuevo']
        : language.startsWith('en')
          ? ['You are offline', 'Connect to the internet to update cards, visits, missions, and rewards. Loyalty actions cannot be confirmed offline.', 'Try again']
          : ['Você está sem conexão', 'Conecte-se à internet para atualizar cartões, visitas, missões e recompensas. Nenhuma ação de fidelidade pode ser confirmada offline.', 'Tentar novamente'];
      document.documentElement.lang = language.startsWith('es') ? 'es' : language.startsWith('en') ? 'en' : 'pt-BR';
      document.getElementById('offline-title').textContent = translations[0];
      document.getElementById('offline-description').textContent = translations[1];
      document.getElementById('offline-retry').textContent = translations[2];
    </script>
  </body>
</html>
